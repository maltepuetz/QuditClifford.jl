# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # `skip-changelog` exempts these from the Changelog workflow's required
    # check, which Dependabot cannot satisfy on its own.
    labels:
      - "dependencies"
      - "skip-changelog"
