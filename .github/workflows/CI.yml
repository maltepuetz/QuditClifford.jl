name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}${{ matrix.layout && format(' - {0}-major', matrix.layout) || '' }}${{ matrix.eltype && format(' - {0}', matrix.eltype) || '' }}${{ matrix.shard && format(' - {0}', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 45
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Whole suite in one job where it is fast enough.
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1'
            os: macOS-latest
            arch: aarch64
          # Shipped defaults, split by test/runtests.jl's QC_TEST_SHARD. The
          # coverage jobs run the kernel files in two halves, because
          # instrumentation makes them slow.
          - version: '1'
            os: ubuntu-latest
            arch: x64
            shard: kernel-1
            coverage: true
          - version: '1'
            os: ubuntu-latest
            arch: x64
            shard: kernel-2
            coverage: true
          - version: '1'
            os: ubuntu-latest
            arch: x64
            shard: functional
            coverage: true
          - version: '1'
            os: windows-latest
            arch: x64
            shard: kernel
          - version: '1'
            os: windows-latest
            arch: x64
            shard: functional
          - version: '1'
            os: ubuntu-latest
            arch: x86
            shard: kernel
          - version: '1'
            os: ubuntu-latest
            arch: x86
            shard: functional-1
          - version: '1'
            os: ubuntu-latest
            arch: x86
            shard: functional-2
          - version: '1'
            os: windows-latest
            arch: x86
            shard: kernel
          - version: '1'
            os: windows-latest
            arch: x86
            shard: functional-1
          - version: '1'
            os: windows-latest
            arch: x86
            shard: functional-2
          - version: 'pre'
            os: ubuntu-latest
            arch: x64
            shard: kernel
            experimental: true
          - version: 'pre'
            os: ubuntu-latest
            arch: x64
            shard: functional
            experimental: true
          # The other three configurations of the functional files.
          - version: '1'
            os: ubuntu-latest
            arch: x64
            shard: functional
            layout: qudit
            coverage: true
          - version: '1'
            os: ubuntu-latest
            arch: x64
            shard: functional
            eltype: bits
            coverage: true
          - version: '1'
            os: ubuntu-latest
            arch: x64
            shard: functional
            layout: qudit
            eltype: bits
            coverage: true
          # The kernel files with both defaults switched, in two halves.
          - version: '1'
            os: ubuntu-latest
            arch: x64
            shard: kernel-1
            layout: qudit
            eltype: bits
            coverage: true
          - version: '1'
            os: ubuntu-latest
            arch: x64
            shard: kernel-2
            layout: qudit
            eltype: bits
            coverage: true
          # Packed storage on 32-bit.
          - version: '1'
            os: ubuntu-latest
            arch: x86
            shard: functional-1
            eltype: bits
          - version: '1'
            os: ubuntu-latest
            arch: x86
            shard: functional-2
            eltype: bits
          # The kernel files with both defaults switched on 32-bit: the
          # qudit-major and packed kernels have width-dependent code (lane
          # types, dual accumulators, word transposes).
          - version: '1'
            os: ubuntu-latest
            arch: x86
            shard: kernel
            layout: qudit
            eltype: bits
          # The whole suite with both defaults switched on the oldest
          # supported Julia, which splits fewer unions than later versions,
          # as the kernel and functional shards.
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            shard: kernel
            layout: qudit
            eltype: bits
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            shard: functional
            layout: qudit
            eltype: bits
          # The kernel files on Julia 1.12, whose inference differs from 1.10
          # and from the current release: the zero-allocation tests of
          # test/bits.jl cover stored operators and the packed kernels.
          - version: '1.12'
            os: ubuntu-latest
            arch: x64
            shard: kernel
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Coverage instrumentation slows the tests; only the jobs that
          # upload a report pay for it.
          coverage: ${{ matrix.coverage == true }}
        env:
          QC_TEST_LAYOUT: ${{ matrix.layout || 'generator' }}
          QC_TEST_ELTYPE: ${{ matrix.eltype || 'uint8' }}
          QC_TEST_SHARD: ${{ matrix.shard || 'all' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage == true
      - uses: codecov/codecov-action@v7
        if: matrix.coverage == true
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using QuditClifford
          DocMeta.setdocmeta!(QuditClifford, :DocTestSetup, :(using QuditClifford); recursive=true)
          doctest(QuditClifford)
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
