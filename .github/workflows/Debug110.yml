# TEMPORARY: narrows down the segfault of the Julia 1.10 x64 job without
# coverage. Remove before merging.
name: Debug 1.10 (temporary)
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    # @turbo is removed from every source file except `keep`.
    name: ${{ matrix.ref && 'main' || 'head' }} keep ${{ matrix.keep }} | ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        keep: [canonicalize.jl, destabilizer_tableau.jl, span_decomposition.jl, xz_block.jl, canonicalize_qudit_major.jl, entanglement_negativity.jl, rank_workspaces.jl, state_expansion.jl]
        rep: [1, 2, 3, 4, 5]
        ref: ['']
        include:
          - {keep: ALL, rep: 1, ref: e4dfc66b1c5d779618fcc3d700e25c6e95e1a078}
          - {keep: ALL, rep: 2, ref: e4dfc66b1c5d779618fcc3d700e25c6e95e1a078}
          - {keep: ALL, rep: 3, ref: e4dfc66b1c5d779618fcc3d700e25c6e95e1a078}
          - {keep: ALL, rep: 4, ref: e4dfc66b1c5d779618fcc3d700e25c6e95e1a078}
          - {keep: ALL, rep: 5, ref: e4dfc66b1c5d779618fcc3d700e25c6e95e1a078}
          - {keep: ALL, rep: 6, ref: e4dfc66b1c5d779618fcc3d700e25c6e95e1a078}
    steps:
      - name: Need AVX-512
        id: cpu
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if grep -q avx512f /proc/cpuinfo && ! grep -q 'EPYC 9V74' /proc/cpuinfo; then echo "avx512=yes" >> "$GITHUB_OUTPUT"; else echo "SKIP: no AVX-512 on this runner"; fi
      - uses: actions/checkout@v7
        if: steps.cpu.outputs.avx512 == 'yes'
        with:
          ref: ${{ matrix.ref || github.event.pull_request.head.sha }}
      - uses: julia-actions/setup-julia@v3
        if: steps.cpu.outputs.avx512 == 'yes'
        with:
          version: '1.10'
      - name: Patch
        if: steps.cpu.outputs.avx512 == 'yes' && matrix.keep != 'ALL'
        run: |
          main="modular.jl operator.jl xz_block.jl span_decomposition.jl projective_measurement.jl destabilizer_tableau.jl helper.jl check_purity.jl canonicalize.jl entanglement_entropy.jl stabilizer_tableau.jl"
          for f in $(grep -rl '@turbo' src); do
            b=$(basename $f)
            if [ "$b" = "${{ matrix.keep }}" ]; then
              continue
            fi
            sed -i -E '/^import/! s/@turbo( [a-z_]+=[a-z]+)* //' $f
          done
          echo "files still using @turbo:"; grep -rlE '^[^#]*@turbo for|&& @turbo' src || true
      - uses: julia-actions/julia-buildpkg@v1
        if: steps.cpu.outputs.avx512 == 'yes'
      - name: Run
        if: steps.cpu.outputs.avx512 == 'yes'
        run: |
          julia --project=. -e 'using InteractiveUtils; versioninfo(); using LoopVectorization; VB = LoopVectorization.VectorizationBase; println("LV register size ", VB.register_size(), " width Int ", VB.pick_vector_width(Int), " width UInt8 ", VB.pick_vector_width(UInt8))'
          julia --project=. --color=no --check-bounds=yes -g2 -e '
            using Test
            @testset "debug" begin
                include(joinpath(pwd(), "test", "storage_types.jl"))
            end'
