codecov:
  notify:
    # Ten CI jobs upload a report (the `coverage: true` entries of the test
    # matrix in .github/workflows/CI.yml). Wait for all of them before
    # reporting a status.
    after_n_builds: 10
comment:
  after_n_builds: 10
coverage:
  status:
    project:
      default:
        # Which lines count as code varies a little with how the suite is
        # split over processes (function headers and `end` lines appear with
        # zero hits), so allow that much before failing.
        threshold: 0.5%
    patch:
      default:
        # The same artefact in a diff: the header of a function whose body is
        # hit, or the `end` of a `@simd` loop, reported with zero hits (0.52%
        # of the lines of a 1345-line diff).
        threshold: 0.5%
ignore:
  # The precompile workload runs only while the package image is generated,
  # never in the instrumented test processes, so every line of it reads as
  # missed.
  - "src/precompile.jl"
